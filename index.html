<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Opt-in directory</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1>Opt-in directory</h1>
    <p>Employees who are willing to have a short, informal conversation with an intern from another team. Use fiction, non-sensitive information.</p>
    <form id="note-form" novalidate>
      <label for="note-input">Directory entry</label>
      <p id="note-help">Enter 1–200 characters. Notes stay in this browser profile and site only.</p>
      <input id="note-input" name="note" type="text" aria-describedby="note-help note-error" autocomplete="off" placeholder="e.g. Jordan - Business Credit: Happy to talk about a typical day.">
      <button type="submit">Add yourself</button>
      <p id="note-error" role="alert"></p>
    </form>
    <p id="save-status" role="status" aria-live="polite"></p>
    <h2>Currently opted in</h2>
    <p id="empty-state">No one has opted in yet.</p>
    <ul id="note-list" aria-label="Currently opted in"></ul>
  </main>
</body>
</html>
